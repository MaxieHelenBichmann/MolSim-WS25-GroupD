settings:
    format: Settings
    delta_t: 0.0005
    end_time: 20.0
    start_time: 0.0
    base_name: "boundary_test"
    force: "Lennard Jones"
    frequency: 10
    cutoff: 3.0
    domain:
      x: 180.0
      y: 90.0
      z: 50.0
      boundaries:
        left:
          type: REFLECTING
          sigma: 1.2
          epsilon: 5.0
        right:
          type: REFLECTING
        front:
          type: OUTFLOW
        back:
          type: OUTFLOW
        upper:
          type: REFLECTING
          sigma: 2.0
          epsilon: 10.0
        lower:
          type: OUTFLOW

xvm_1:
    format: XVM
    num_particles: 1
    particles:
        - coordinates:
            x: 10.0
            y: 10.0
            z: 10.0
          velocity:
            vx: 0.0
            vy: 0.0
            vz: 0.0
          mass: 1.0
