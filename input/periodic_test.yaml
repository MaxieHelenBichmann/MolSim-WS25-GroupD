settings:
  format: Settings
  delta_t: 0.001
  end_time: 2.0
  start_time: 0.0
  frequency: 10
  cutoff: 3.0
  container: LINKED
  domain:
    coordinates: [20.0, 10.0, 1.0]
    dimensions: 2
    boundaries:
      left:
        type: PERIODIC
      right:
        type: PERIODIC
      top:
        type: REFLECTING
      bottom:
        type: REFLECTING
      upper:
        type: OUTFLOW
      lower:
        type: OUTFLOW
  pairwise_forces: [LENNARDJONES]
periodic_particles:
  format: XVM
  num_particles: 2
  particles: 
    - coordinates: [0.8, 5.0, 0.5] 
      velocity: [-0.5, 0.0, 0.0]
      mass: 1.0
      epsilon: 1.0
      sigma: 1.0 
    - coordinates: [19.2, 5.0, 0.5]
      velocity: [0.5, 0.0, 0.0]
      mass: 1.5
      epsilon: 1.0
      sigma: 1.0
