name: CI MolSim

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: mini-arc-runner-set
    container:
      image: mbichmann/molsim-vtk
    env:
      BUILD_TYPE: Release
      BUILD_DIR: build

    steps:
    - uses: actions/checkout@v4

    - name: Cache CMake build
      uses: actions/cache@v4
      with:
        path: build
        key: ${{ runner.os }}-cmake-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}
        restore-keys: |
          ${{ runner.os }}-cmake-

    - name: Configure CMake
      run: cmake -G Ninja -S . -B "$BUILD_DIR" -DCMAKE_BUILD_TYPE="${BUILD_TYPE}" -DENABLE_VTK_OUTPUT=ON -DCMAKE_COMPILE_WARNING_AS_ERROR=ON

    - name: Build
      run: cmake --build "$BUILD_DIR" --config "${BUILD_TYPE}"

    - name: Debug cache path
      run: |
        echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
        ls -la "$GITHUB_WORKSPACE"
        ls -la build || true
        find build -maxdepth 2 -type d -print

    - name: Test
      run: ctest --test-dir "$BUILD_DIR/tests" --output-on-failure

  sanitizer:
    runs-on: mini-arc-runner-set
    container:
      image: mbichmann/molsim-vtk
    env:
      BUILD_DIR: build-asan
      BUILD_TYPE: Debug

    steps:
    - uses: actions/checkout@v4

    - name: Cache CMake build
      uses: actions/cache@v4
      with:
        path: build-asan
        key: ${{ runner.os }}-cmake-asan-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}
        restore-keys: |
          ${{ runner.os }}-cmake-asan-

    - name: Configure (ASan, Clang)
      run: |
          cmake -G Ninja -S . -B "$BUILD_DIR" \
            -DCMAKE_BUILD_TYPE="${BUILD_TYPE}" \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_FLAGS="${CMAKE_C_FLAGS} -fsanitize=address -fno-omit-frame-pointer -fprofile-instr-generate -fcoverage-mapping" \
            -DCMAKE_CXX_FLAGS="${CMAKE_CXX_FLAGS} -fsanitize=address -fno-omit-frame-pointer -fprofile-instr-generate -fcoverage-mapping" \
            -DCMAKE_EXE_LINKER_FLAGS="${CMAKE_EXE_LINKER_FLAGS} -fprofile-instr-generate" \
            -DENABLE_VTK_OUTPUT=ON \
            -DCMAKE_COMPILE_WARNING_AS_ERROR=ON

    - name: Build
      run: cmake --build "$BUILD_DIR" --config "${BUILD_TYPE}"

    - name: Test (ASan)
      run: ctest --test-dir "$BUILD_DIR/tests" --output-on-failure
      env:
        ASAN_OPTIONS: halt_on_error=1
        LLVM_PROFILE_FILE: ${{ env.BUILD_DIR }}/%p-%m.profraw

    - name: Merge coverage data
      if: ${{ always() }}
      run: |
          shopt -s nullglob
          PROFRAW_FILES=("$BUILD_DIR"/*.profraw)
          if [ ${#PROFRAW_FILES[@]} -eq 0 ]; then
            echo "No coverage data generated; skipping merge."
            exit 0
          fi
          llvm-profdata merge -sparse "${PROFRAW_FILES[@]}" -o "$BUILD_DIR/coverage.profdata"

    - name: Generate coverage report
      if: ${{ always() }}
      run: |
          if [ ! -f "$BUILD_DIR/coverage.profdata" ]; then
            echo "No coverage.profdata found; skipping report generation."
            exit 0
          fi
          mkdir -p "$BUILD_DIR/coverage"
          mapfile -t COVERAGE_TARGETS < <(find "$BUILD_DIR" -maxdepth 3 -type f -perm -111 \( -name 'MolSim' -o -name 'tests' \))
          if [ ${#COVERAGE_TARGETS[@]} -eq 0 ]; then
            echo "No instrumented binaries found for coverage reporting."
            exit 0
          fi
          llvm-cov show "${COVERAGE_TARGETS[@]}" \
            -instr-profile="$BUILD_DIR/coverage.profdata" \
            -format=html \
            -output-dir="$BUILD_DIR/coverage" \
            -path-equivalence="$GITHUB_WORKSPACE=."
          llvm-cov report "${COVERAGE_TARGETS[@]}" \
            -instr-profile="$BUILD_DIR/coverage.profdata" \
            > "$BUILD_DIR/coverage/summary.txt"
          cp "$BUILD_DIR/coverage.profdata" "$BUILD_DIR/coverage/coverage.profdata"
          llvm-cov export "${COVERAGE_TARGETS[@]}" \
            -instr-profile="$BUILD_DIR/coverage.profdata" \
            -format=lcov \
            > "$BUILD_DIR/coverage/lcov.info"

    - name: Upload coverage artifact
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: sanitizer-coverage-report
        path: ${{ env.BUILD_DIR }}/coverage
        if-no-files-found: ignore

  documentation:
    runs-on: mini-arc-runner-set
    container:
      image: mbichmann/molsim-vtk

    steps:
    - uses: actions/checkout@v4

    - name: Setup Pages
      uses: actions/configure-pages@v5

    - name: Configure
      run: cmake -G Ninja -S . -B build
      
    - name: Build Documentation
      run: cmake --build build --target doc_doxygen

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: './doxys_documentation/html'
  
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

