name: MolSim Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: self-hosted
    strategy:
      matrix:
        build_type: [Debug, Release]
        compiler: [g++, clang++]
        sanitize: [no-san, asan-ubsan, tsan]
        exclude:
          - build_type: Release
            sanitize: asan-ubsan
          - build_type: Release
            sanitize: tsan
          - compiler: g++
            sanitize: tsan
        include:
          - build_type: Debug
            compiler: clang++
            sanitize: no-san
            coverage: true
    env:
      BUILD_DIR: build-${{ matrix.compiler }}-${{ matrix.build_type }}-${{ matrix.sanitize }}
      CXX_FLAGS: ${{ matrix.sanitize != 'no-san' && format('-O1 -fsanitize={0} -fno-omit-frame-pointer', matrix.sanitize == 'asan-ubsan' && 'address,undefined' || matrix.sanitize == 'tsan' && 'thread' || '') || '' }}
      LLVM_PROFILE_FILE: 'build-${{ matrix.compiler }}-${{ matrix.build_type }}-${{ matrix.sanitize }}/%p-%m.profraw'
      ASAN_OPTIONS: 'halt_on_error=1'
      UBSAN_OPTIONS: 'halt_on_error=1:print_stacktrace=1'
      TSAN_OPTIONS: 'halt_on_error=1'

    steps:
    - uses: actions/checkout@v4

    - name: Cache CMake build
      uses: actions/cache@v4
      with:
        path: ${{ env.BUILD_DIR }}
        key: cmake-${{ matrix.compiler }}-${{ matrix.build_type }}-${{ matrix.sanitize }}-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'src/**/CMakeLists.txt') }}
        restore-keys: |
          cmake-${{ matrix.compiler }}-${{ matrix.build_type }}-${{ matrix.sanitize }}-

    - name: Configure
      run: |
        cmake -G Ninja -S . -B "$BUILD_DIR" \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type}} \
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_FLAGS="$CXX_FLAGS" \
          -DENABLE_VTK_OUTPUT=ON \
          -DCMAKE_COMPILE_WARNING_AS_ERROR=ON \
          -DENABLE_CLANG_TIDY=OFF \
          ${{ matrix.coverage && '-DCOVERAGE=ON' || '' }}

    - name: Build
      run: cmake --build "$BUILD_DIR"

    - name: Test
      run: ctest --test-dir "$BUILD_DIR/tests" --output-on-failure

    - name: Coverage report
      if: matrix.coverage
      run: cmake --build "$BUILD_DIR" --target coverage_report

    - name: Upload coverage
      if: matrix.coverage
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: ${{ env.BUILD_DIR }}/coverage
        if-no-files-found: ignore
      
  lint:
    runs-on: self-hosted
    needs: test
    env:
      BUILD_DIR: build-lint
    steps:
    - uses: actions/checkout@v4

    - name: Cache lint build
      uses: actions/cache@v4
      with:
        path: ${{ env.BUILD_DIR }}
        key: lint-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'src/**/CMakeLists.txt', 'src/**/*.cpp', 'src/**/*.h', 'include/**/*.h', 'tests/**/*.cpp', 'benchmarks/**/*.cpp', '.clang-tidy') }}
        restore-keys: |
          lint-

    - name: Configure
      run: |
        cmake -G Ninja -S . -B "$BUILD_DIR" \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_CXX_COMPILER=clang++ \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DENABLE_CLANG_TIDY=ON

    - name: Build with clang-tidy
      run: cmake --build "$BUILD_DIR"
  
  codecov:
    runs-on: self-hosted
    needs: lint
    if: github.event_name == 'workflow_dispatch'
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - uses: actions/download-artifact@v4
      with:
        name: coverage-report

    - uses: codecov/codecov-action@v4
      with:
        files: coverage/coverage.lcov
        token: ${{ secrets.CODECOV_TOKEN }}

  docs:
    runs-on: self-hosted
    needs: lint
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/configure-pages@v5

    - name: Configure Docs
      run: cmake -G Ninja -S . -B build
    
    - name: Build Docs 
      run: cmake --build build --target doc_doxygen

    - uses: actions/upload-pages-artifact@v3
      with:
        path: ./doxys_documentation/html
    
    - uses: actions/deploy-pages@v4
